name: CI BLAS Tests

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            gcc \
            gfortran \
            libopenblas-dev \
            python3 \
            python3-pip

      - name: Install Python packages
        run: |
          pip3 install numpy colorama

      - name: Compile SYRK
        run: |
          gcc Lab3MySYRK/SYRK.c -o syrk \
            -O3 \
            -fopenmp \
            -mavx \
            -mfma \
            -lopenblas \
            -lm \
            -DCI

      - name: Run BLAS interface tests
        run: |
          python3 Lab2TestBlas/test.py

      - name: Run performance tests
        run: |
          ./syrk
